<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#FAF6EE" />
<title>Adega Marques Silva</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#FAF6EE; --ink:#2B2320; --wine:#5C1220; --olive:#5B6B3A; --terra:#B0683F; --muted:#8A7A66; --soft:#6B5D4F; --line:#C9B9A0; --dot:#D9CDB8; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body { font-family:'EB Garamond', Georgia, serif; font-size:17px; -webkit-font-smoothing:antialiased; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap { max-width:560px; margin:0 auto; padding:34px 24px 48px; }
  .sc { font-variant:small-caps; letter-spacing:.12em; color:var(--muted); font-size:14px; }
  .disp { font-family:'Cormorant Garamond', Georgia, serif; font-weight:500; }
  hr.rule { border:0; border-top:0.5px solid var(--line); margin:0; }
  .mast { text-align:center; }
  .mast h1 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; color:var(--wine); font-size:38px; line-height:1.05; margin:6px 0 10px; }
  .summary { text-align:center; font-style:italic; color:var(--soft); font-size:16px; padding:8px 0; }
  .filters { display:flex; justify-content:center; gap:18px; margin:16px 0 6px; flex-wrap:wrap; }
  .filters button { background:none; border:0; padding:4px 0; font-family:inherit; font-variant:small-caps; letter-spacing:.12em; font-size:15px; color:var(--muted); cursor:pointer; border-bottom:0.5px solid transparent; }
  .filters button.on { color:var(--wine); border-bottom-color:var(--wine); }
  .search { display:block; width:100%; margin:8px 0 0; border:0; border-bottom:0.5px solid var(--dot); background:transparent; font-family:inherit; font-style:italic; font-size:16px; color:var(--ink); padding:8px 2px; text-align:center; outline:none; }
  .sec { text-align:center; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:26px; color:var(--wine); margin:30px 0 2px; }
  .orn { text-align:center; color:var(--terra); font-size:13px; letter-spacing:.5em; margin:0 0 6px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:14px; padding:12px 0; border-bottom:0.5px dotted var(--dot); cursor:pointer; }
  .row:last-child { border-bottom:0; }
  .row:active { background: rgba(92,18,32,.04); }
  .nm { font-family:'Cormorant Garamond',Georgia,serif; font-size:22px; line-height:1.15; color:var(--ink); }
  .pr { font-variant:small-caps; letter-spacing:.08em; font-size:14px; color:var(--muted); margin-top:2px; }
  .rt { text-align:right; flex-shrink:0; }
  .yr { font-variant-numeric:oldstyle-nums; font-size:19px; color:var(--wine); }
  .q { font-size:14px; color:var(--olive); font-style:italic; }
  .gone .nm, .gone .yr { color:var(--muted); }
  .foot { text-align:center; margin-top:34px; font-size:13px; color:var(--muted); font-style:italic; line-height:1.6; }
  .back { background:none; border:0; font-family:inherit; font-variant:small-caps; letter-spacing:.12em; font-size:15px; color:var(--muted); padding:0; cursor:pointer; }
  .f-prod { text-align:center; margin-top:20px; }
  .f-name { text-align:center; font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:36px; line-height:1.08; color:var(--wine); margin:6px 0 4px; }
  .f-sub { text-align:center; font-style:italic; color:var(--soft); font-size:17px; }
  .lb { font-variant:small-caps; letter-spacing:.1em; font-size:14px; color:var(--muted); margin:18px 0 3px; }
  .tx { font-size:17px; line-height:1.55; margin:0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pair { background:rgba(176,104,63,.07); border-top:0.5px solid var(--terra); border-bottom:0.5px solid var(--terra); padding:12px 4px 14px; margin-top:22px; }
  .pair .lb { margin-top:0; color:var(--terra); }
  .pair ul { margin:4px 0 0; padding:0; list-style:none; }
  .pair li { font-size:17px; line-height:1.5; padding:3px 0; }
  .pair li:before { content:"— "; color:var(--terra); }
  .badge { display:inline-block; font-variant:small-caps; letter-spacing:.08em; font-size:13px; border:0.5px solid currentColor; border-radius:10px; padding:0 8px; }
  .b-verificado { color:var(--olive); } .b-inferencia { color:var(--terra); } .b-nao_verificado { color:var(--muted); }
  .stock { display:flex; justify-content:space-between; align-items:center; margin-top:22px; padding-top:14px; border-top:0.5px solid var(--line); }
  .stock .n { font-family:'Cormorant Garamond',Georgia,serif; font-size:26px; color:var(--wine); }
  .src { font-size:14px; color:var(--muted); font-style:italic; line-height:1.5; margin-top:14px; }
  .hist li { font-size:16px; line-height:1.5; }
  .empty { text-align:center; font-style:italic; color:var(--muted); margin:30px 0; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Abrindo a carta…</p></div>
<script>
const DATA_URL = "adega.json";
const CACHE_KEY = "adega-marques-silva-carta-cache";
const SECOES = [["tinto","Tintos"],["branco","Brancos"],["rose","Rosés"],["espumante","Espumantes"],["fortificado","Fortificados"]];
const CERT = { verificado:"Verificado", inferencia:"Inferência", nao_verificado:"Não verificado" };
let D = null, filtro = "todos", busca = "", origem = "";

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ehSafra = (s) => /^\d{4}$/.test(String(s || "").trim());
const safraCurta = (w) => ehSafra(w.safra) ? w.safra : (w.safra && !String(w.safra).startsWith("[") ? "NV" : "—");
const lugar = (w) => {
  const r = String(w.regiao || "").split(/[,(·]/)[0].trim();
  return r || String(w.pais || "").split(",")[0].trim();
};
const paisBase = (w) => { const p = String(w.pais || ""); return p.includes(",") ? p.split(",").pop().trim() : p.trim(); };

async function carregar() {
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    D = await r.json(); origem = "online";
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(D)); } catch (e) {}
  } catch (e) {
    try { D = JSON.parse(localStorage.getItem(CACHE_KEY)); origem = "cache"; } catch (e2) {}
  }
  if (!D) { document.getElementById("app").innerHTML = '<p class="empty">Não foi possível abrir a carta. Verifique a conexão.</p>'; return; }
  rota();
}

function rota() {
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const w = id && D.vinhos.find((v) => v.id === id);
  w ? ficha(w) : carta();
  window.scrollTo(0, 0);
}

function carta() {
  const vs = D.vinhos;
  const ativos = vs.filter((w) => Number(w.quantidade) > 0);
  const garrafas = ativos.reduce((a, w) => a + Number(w.quantidade), 0);
  const paises = new Set(ativos.map(paisBase).filter(Boolean)).size;
  const q = busca.trim().toLowerCase();
  const passa = (w) => (filtro === "todos" || w.tipo === filtro) &&
    (!q || [w.nome, w.produtor, w.uva, w.regiao, w.pais, w.composicao, w.harmonizacao].some((f) => String(f || "").toLowerCase().includes(q)));

  let html = `<div class="mast"><div class="sc">Reserva particular</div><h1>Adega Marques Silva</h1></div>
    <hr class="rule"><div class="summary">${garrafas} garrafas · ${ativos.length} rótulos · ${paises} países</div><hr class="rule">
    <div class="filters">${[["todos","Todos"], ...SECOES.filter(([t]) => vs.some((w) => w.tipo === t))].map(([t,l]) => `<button data-f="${t}" class="${filtro===t?"on":""}">${l}</button>`).join("")}</div>
    <input class="search" id="busca" placeholder="buscar vinho, uva ou prato" value="${esc(busca)}" />`;

  let algum = false;
  SECOES.forEach(([t, l]) => {
    const lista = ativos.filter((w) => w.tipo === t && passa(w));
    if (!lista.length) return;
    algum = true;
    html += `<div class="sec">${l}</div><div class="orn">· · ·</div>` + lista.map((w) => linha(w, false)).join("");
  });
  const fora = vs.filter((w) => Number(w.quantidade) <= 0 && passa(w));
  if (fora.length) { algum = true; html += `<div class="sec">Já degustados</div><div class="orn">· · ·</div>` + fora.map((w) => linha(w, true)).join(""); }
  if (!algum) html += `<p class="empty">Nenhum vinho encontrado.</p>`;

  html += `<div class="foot">${origem === "cache" ? "Sem conexão — mostrando a última versão salva.<br>" : ""}Carta atualizada em ${fmtData(D.atualizado)}.<br>Alterações: é só pedir ao Claude no chat.</div>`;
  const app = document.getElementById("app");
  app.innerHTML = html;
  app.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { filtro = b.dataset.f; carta(); });
  app.querySelectorAll("[data-id]").forEach((r) => r.onclick = () => { location.hash = "/" + encodeURIComponent(r.dataset.id); });
  const inp = document.getElementById("busca");
  inp.oninput = (e) => { busca = e.target.value; const pos = e.target.selectionStart; carta(); const n = document.getElementById("busca"); n.focus(); n.setSelectionRange(pos, pos); };
}

function linha(w, gone) {
  return `<div class="row ${gone ? "gone" : ""}" data-id="${esc(w.id)}">
    <div><div class="nm">${esc(w.nome)}</div><div class="pr">${esc([w.produtor, lugar(w)].filter(Boolean).join(" · "))}</div></div>
    <div class="rt"><div class="yr">${esc(safraCurta(w))}</div><div class="q">${gone ? "esgotado" : esc(w.quantidade) + (Number(w.quantidade) === 1 ? " garrafa" : " garrafas")}</div></div></div>`;
}

function campo(lb, v) { return v ? `<div class="lb">${lb}</div><p class="tx">${esc(v)}</p>` : ""; }

function ficha(w) {
  const hs = String(w.harmonizacao || "").split(/;\s*/).filter(Boolean);
  const hist = (D.historico || []).filter((h) => h.id === w.id).sort((a, b) => String(b.data).localeCompare(String(a.data)));
  const sub = [ehSafra(w.safra) ? "Safra " + w.safra : w.safra, w.tipo && (SECOES.find(([t]) => t === w.tipo) || [, ""])[1].replace(/s$/, "")].filter(Boolean).join(" · ");
  let html = `<button class="back" onclick="location.hash=''">‹ Carta</button>
    <div class="f-prod sc">${esc([w.produtor, paisBase(w)].filter(Boolean).join(" · "))}</div>
    <div class="f-name">${esc(w.nome)}</div>
    <div class="f-sub">${esc(sub)}</div>
    <div class="orn" style="margin:14px 0 0">· · ·</div>
    ${campo("Uvas", w.composicao || w.uva)}
    ${campo("Origem", [w.regiao, w.pais].filter(Boolean).join(" · "))}
    ${campo("Amadurecimento", w.amadurecimento)}
    ${(w.abv || w.guarda) ? `<div class="grid2"><div>${campo("Teor alcoólico", w.abv)}</div><div>${campo("Guarda", w.guarda)}</div></div>` : ""}
    ${hs.length ? `<div class="pair"><div class="lb">Vai bem com</div><ul>${hs.map((h) => `<li>${esc(h)}</li>`).join("")}</ul></div>` : ""}
    ${campo("Nota de degustação", w.nota)}
    ${hist.length ? `<div class="lb">Garrafas abertas</div><ul class="hist" style="margin:2px 0 0;padding-left:18px">${hist.map((h) => `<li>${fmtData(h.data)}${h.nota ? " — <i>" + esc(h.nota) + "</i>" : ""}</li>`).join("")}</ul>` : ""}
    ${(w.valor || w.local) ? `<div class="grid2"><div>${campo("Valor pago", w.valor ? "R$ " + w.valor : "")}</div><div>${campo("Onde comprou", w.local)}</div></div>` : ""}
    <div class="stock"><span>${w.certeza ? `<span class="badge b-${esc(w.certeza)}">${CERT[w.certeza] || ""}</span>` : ""}</span>
      <span><span class="n">${esc(w.quantidade)}</span> <span class="sc">${Number(w.quantidade) === 1 ? "garrafa" : "garrafas"}</span></span></div>
    ${w.fontes ? `<div class="src">Fontes: ${esc(w.fontes)}</div>` : ""}
    ${hs.length ? `<div class="src">Harmonizações: sugestão do Claude.</div>` : ""}`;
  document.getElementById("app").innerHTML = html;
}

function fmtData(s) {
  const m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : esc(s || "");
}

window.addEventListener("hashchange", rota);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") carregar(); });
carregar();
</script>
</body>
</html>
