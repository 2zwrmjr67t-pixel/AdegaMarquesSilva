<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adega Marques Silva</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FAF7F2;
    color: #2B2320;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .mono { font-family: 'Courier New', monospace; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #D9CBB8; border-radius: 3px; }
  input, textarea, button { font-family: inherit; }
  button { cursor: pointer; }

  header { padding: 32px 20px 20px; border-bottom: 1px solid #E4D9C8; }
  .header-row { display: flex; align-items: flex-end; justify-content: space-between; }
  .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #A9835A; margin: 0 0 6px; font-weight: 600; }
  h1 { font-size: 30px; font-weight: 700; color: #5C1220; margin: 0; line-height: 1.05; }
  .total-num { font-size: 30px; color: #5C1220; line-height: 1; }
  .total-label { font-size: 11px; color: #7A6F62; text-transform: uppercase; letter-spacing: 0.06em; margin: 2px 0 0; }

  .search-wrap { padding: 16px 20px 0; }
  .search-box { display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #E4D9C8; border-radius: 10px; padding: 10px 12px; }
  .search-box input { border: none; outline: none; background: transparent; font-size: 14px; width: 100%; color: #2B2320; }

  .filters { padding: 16px 20px 4px; display: flex; gap: 8px; overflow-x: auto; }
  .chip { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid #E4D9C8; background: #FFFFFF; color: #7A6F62; }
  .chip.active { color: #FFF8F0; border-color: transparent; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  main { padding: 20px 20px 110px; }
  .empty-state { text-align: center; padding-top: 64px; color: #7A6F62; }
  .card { background: #FFFFFF; border: 1px solid #E4D9C8; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card-left { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .tipo-dot { margin-top: 6px; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .card-title { font-size: 17px; font-weight: 600; margin: 0; color: #2B2320; line-height: 1.25; }
  .card-sub { font-size: 12.5px; color: #7A6F62; margin: 3px 0 0; }
  .card-origin { font-size: 12.5px; color: #A9835A; margin: 4px 0 0; }
  .qty-box { display: flex; align-items: center; gap: 4px; background: #FAF7F2; border: 1px solid #E4D9C8; border-radius: 999px; padding: 4px; flex-shrink: 0; }
  .qty-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: transparent; color: #2B2320; }
  .qty-num { width: 20px; text-align: center; font-size: 14px; }
  .card-extra { margin-top: 12px; padding-top: 12px; border-top: 1px solid #EFE7DA; font-size: 12.5px; color: #7A6F62; }
  .card-extra p { margin: 0 0 4px; }
  .card-extra .label { color: #A9835A; }
  .card-extra-row { display: flex; gap: 16px; padding-top: 2px; }
  .card-actions { display: flex; justify-content: flex-end; gap: 14px; margin-top: 8px; }
  .icon-btn { border: none; background: transparent; color: #7A6F62; padding: 2px; display: flex; }
  .icon-btn.danger { color: #B8697A; }

  .fab { position: fixed; bottom: 24px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: #5C1220; color: #FAF7F2; border: 2px solid #A9835A; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(92,18,32,0.25); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(43,35,32,0.45); display: flex; align-items: flex-end; z-index: 50; }
  .modal { background: #FFFFFF; width: 100%; max-height: 90vh; overflow-y: auto; border-top-left-radius: 20px; border-top-right-radius: 20px; border-top: 1px solid #E4D9C8; padding: 20px; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-header h2 { font-size: 20px; font-weight: 700; color: #5C1220; margin: 0; }
  .form-grid { display: flex; flex-direction: column; gap: 12px; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label.field-label { font-size: 12px; color: #7A6F62; display: block; margin-bottom: 6px; }
  .field-input, .field-textarea { width: 100%; background: #FAF7F2; border: 1px solid #E4D9C8; border-radius: 8px; padding: 9px 12px; font-size: 14px; outline: none; color: #2B2320; }
  .tipo-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .tipo-option { padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid #E4D9C8; background: #FFFFFF; color: #7A6F62; }
  .tipo-option.active { color: #FFF8F0; border-color: transparent; }
  .submit-btn { width: 100%; margin-top: 20px; margin-bottom: 6px; padding: 13px 0; border-radius: 10px; background: #5C1220; color: #FAF7F2; font-weight: 600; font-size: 15px; border: 1px solid #A9835A; }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <p class="eyebrow">Reserva Particular</p>
      <h1 class="serif">Adega Marques Silva</h1>
    </div>
    <div style="text-align:right;">
      <div class="total-num mono" id="totalGarrafas">0</div>
      <p class="total-label">garrafas</p>
    </div>
  </div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9835A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" placeholder="Buscar por nome, uva, produtor, região..." />
  </div>
</div>

<div class="filters" id="filters"></div>

<main>
  <div id="listContainer"></div>
</main>

<button class="fab" id="fabBtn" aria-label="Adicionar garrafa">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div id="modalRoot"></div>

<script>
/* ---------- Data ---------- */
const TIPOS = [
  { id: "tinto", label: "Tinto", color: "#6B1F2A" },
  { id: "branco", label: "Branco", color: "#B99A3E" },
  { id: "espumante", label: "Espumante", color: "#A9835A" },
  { id: "rose", label: "Rosé", color: "#B8697A" },
  { id: "fortificado", label: "Fortificado", color: "#5A3A22" },
];
const STORAGE_KEY = "adega-marques-silva-v1";
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random());

const SEED_WINES = [
  { id: uid(), nome: "María Magdalena", produtor: "La Legítima by Judas", safra: "2024", uva: "Chardonnay", regiao: "", pais: "", tipo: "branco", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "María Magdalena", produtor: "La Legítima by Judas", safra: "2024", uva: "Semillón", regiao: "", pais: "", tipo: "branco", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Barrabas", produtor: "By Judas", safra: "2021", uva: "", regiao: "", pais: "", tipo: "tinto", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Judas", produtor: "Judas", safra: "2022", uva: "", regiao: "", pais: "", tipo: "tinto", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Chardonnay Reserva", produtor: "Bodega Iribarren", safra: "2023", uva: "Chardonnay", regiao: "Bento Gonçalves, RS", pais: "Brasil", tipo: "branco", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Maragato Cuvée", produtor: "Maragato", safra: "Corte de 6 safras (25% Lote III + 75% 2022)", uva: "", regiao: "", pais: "", tipo: "tinto", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "D.V. Catena Tinto Histórico", produtor: "Catena Zapata", safra: "2024", uva: "Malbec-Petit Verdot", regiao: "Paraje Altamira, Valle de Uco", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Extra Brut Método Tradicional", produtor: "Valmarino & Churchill", safra: "[Não verificado]", uva: "", regiao: "", pais: "", tipo: "espumante", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Cordero con Piel de Lobo (Demisec)", produtor: "Família Millán", safra: "", uva: "", regiao: "", pais: "Mendoza, Argentina", tipo: "espumante", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "Sparkling wine, estilo demisec" },
  { id: uid(), nome: "Valmarino XXVII", produtor: "Valmarino", safra: "2022", uva: "Cabernet Franc", regiao: "Pinto Bandeira, RS", pais: "Brasil", tipo: "tinto", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Valmarino XXV", produtor: "Valmarino", safra: "2020", uva: "Cabernet Franc", regiao: "Pinto Bandeira, RS", pais: "Brasil", tipo: "tinto", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Angélica Zapata Cabernet Franc Alta", produtor: "Catena Zapata", safra: "2022", uva: "Cabernet Franc", regiao: "", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 2, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "El Enemigo Malbec Argentino (Renaissance of Malbec)", produtor: "Catena Zapata", safra: "2021", uva: "Malbec", regiao: "", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 2, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Sottano Reserva de Família 18M", produtor: "Sottano", safra: "2024", uva: "Malbec", regiao: "", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 2, valor: "", local: "", harmonizacao: "", nota: "Añejado 18 meses em barricas de roble" },
  { id: uid(), nome: "Gran Enemigo Gualtallary Single Vineyard", produtor: "El Enemigo", safra: "2018", uva: "Cabernet Franc", regiao: "Gualtallary", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 2, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "El Enemigo Cabernet Franc", produtor: "El Enemigo", safra: "2022", uva: "Cabernet Franc", regiao: "", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 2, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Angélica Zapata Cabernet Franc Alta", produtor: "Catena Zapata", safra: "2020", uva: "Cabernet Franc", regiao: "", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 3, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Perro Callejero Blend de Malbec", produtor: "Mosquita Muerta", safra: "2024", uva: "Malbec", regiao: "", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 3, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Sapo de Otro Pozo", produtor: "Mosquita Muerta", safra: "2024", uva: "Malbec-Cabernet Sauvignon", regiao: "", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 6, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Cordero con Piel de Lobo", produtor: "Mosquita Muerta", safra: "2025", uva: "Malbec", regiao: "", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 9, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "D.V. Catena Cabernet-Malbec", produtor: "Catena Zapata", safra: "2025", uva: "Cabernet Sauvignon-Malbec", regiao: "Vinhedo La Pirámide / Vinhedo Angélica", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 12, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Sapo de Otro Pozo", produtor: "Mosquita Muerta", safra: "2020", uva: "Malbec-Cabernet Sauvignon", regiao: "", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "Cordero con Piel de Lobo", produtor: "Mosquita Muerta", safra: "2024", uva: "Malbec", regiao: "", pais: "Mendoza, Argentina", tipo: "tinto", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" },
  { id: uid(), nome: "LA Jovem Brut", produtor: "LA", safra: "", uva: "", regiao: "", pais: "Brasil", tipo: "espumante", quantidade: 2, valor: "", local: "", harmonizacao: "", nota: "Método Clássico · Vinho Espumante Natural Branco Brut · 12,5% vol" },
];

/* ---------- State ---------- */
let vinhos = [];
let activeTipo = "todos";
let query = "";

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      vinhos = JSON.parse(raw);
    } else {
      vinhos = SEED_WINES;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(vinhos));
    }
  } catch (e) {
    vinhos = SEED_WINES;
  }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(vinhos));
  } catch (e) {
    console.error("Não foi possível salvar localmente:", e);
  }
}

function tipoInfo(id) {
  return TIPOS.find((t) => t.id === id) || TIPOS[0];
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

/* ---------- Rendering ---------- */
function renderFilters() {
  const totalGarrafas = vinhos.reduce((s, v) => s + (Number(v.quantidade) || 0), 0);
  document.getElementById("totalGarrafas").textContent = totalGarrafas;

  const countByTipo = (id) => vinhos.filter((v) => v.tipo === id).reduce((s, v) => s + (Number(v.quantidade) || 0), 0);

  let html = `<button class="chip ${activeTipo === "todos" ? "active" : ""}" data-tipo="todos" style="${activeTipo === "todos" ? "background:#5C1220;border-color:#5C1220;" : ""}">Todos · ${totalGarrafas}</button>`;
  TIPOS.forEach((t) => {
    const active = activeTipo === t.id;
    html += `<button class="chip ${active ? "active" : ""}" data-tipo="${t.id}" style="${active ? `background:${t.color};border-color:${t.color};` : ""}">
      <span class="dot" style="background:${active ? "#FFF8F0" : t.color};"></span> ${t.label} · ${countByTipo(t.id)}
    </button>`;
  });
  document.getElementById("filters").innerHTML = html;

  document.querySelectorAll(".chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeTipo = btn.getAttribute("data-tipo");
      renderAll();
    });
  });
}

function renderList() {
  const q = query.trim().toLowerCase();
  const filtered = vinhos.filter((v) => {
    const matchTipo = activeTipo === "todos" || v.tipo === activeTipo;
    const matchQuery = !q || [v.nome, v.produtor, v.uva, v.regiao, v.pais].some((f) => (f || "").toLowerCase().includes(q));
    return matchTipo && matchQuery;
  });

  const container = document.getElementById("listContainer");

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><p>${vinhos.length === 0 ? "Sua adega está vazia. Adicione a primeira garrafa." : "Nenhuma garrafa encontrada com esse filtro."}</p></div>`;
    return;
  }

  container.innerHTML = filtered.map((v) => {
    const info = tipoInfo(v.tipo);
    const extraLines = [];
    if (v.harmonizacao) extraLines.push(`<p><span class="label">Harmoniza com:</span> ${escapeHtml(v.harmonizacao)}</p>`);
    if (v.nota) extraLines.push(`<p><span class="label">Nota:</span> ${escapeHtml(v.nota)}</p>`);
    const hasExtra = v.harmonizacao || v.nota || v.valor || v.local;

    return `
      <div class="card" data-id="${v.id}">
        <div class="card-top">
          <div class="card-left">
            <span class="tipo-dot" style="background:${info.color};" title="${info.label}"></span>
            <div style="min-width:0;">
              <h3 class="card-title serif">${escapeHtml(v.nome)}</h3>
              <p class="card-sub">${escapeHtml([v.produtor, v.safra].filter(Boolean).join(" · "))}</p>
              ${(v.uva || v.regiao || v.pais) ? `<p class="card-origin">${escapeHtml([v.uva, v.regiao, v.pais].filter(Boolean).join(" · "))}</p>` : ""}
            </div>
          </div>
          <div class="qty-box">
            <button class="qty-btn qty-minus" data-id="${v.id}" aria-label="Diminuir"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <span class="qty-num mono">${v.quantidade}</span>
            <button class="qty-btn qty-plus" data-id="${v.id}" aria-label="Aumentar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          </div>
        </div>
        ${hasExtra ? `<div class="card-extra">
          ${extraLines.join("")}
          <div class="card-extra-row">
            ${v.valor ? `<span class="mono">R$ ${escapeHtml(v.valor)}</span>` : ""}
            ${v.local ? `<span>${escapeHtml(v.local)}</span>` : ""}
          </div>
        </div>` : ""}
        <div class="card-actions">
          <button class="icon-btn edit-btn" data-id="${v.id}" aria-label="Editar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="icon-btn danger delete-btn" data-id="${v.id}" aria-label="Excluir"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
        </div>
      </div>
    `;
  }).join("");

  container.querySelectorAll(".qty-minus").forEach((btn) => btn.addEventListener("click", () => adjustQty(btn.getAttribute("data-id"), -1)));
  container.querySelectorAll(".qty-plus").forEach((btn) => btn.addEventListener("click", () => adjustQty(btn.getAttribute("data-id"), 1)));
  container.querySelectorAll(".edit-btn").forEach((btn) => btn.addEventListener("click", () => openForm(btn.getAttribute("data-id"))));
  container.querySelectorAll(".delete-btn").forEach((btn) => btn.addEventListener("click", () => deleteWine(btn.getAttribute("data-id"))));
}

function renderAll() {
  renderFilters();
  renderList();
}

function adjustQty(id, delta) {
  const wine = vinhos.find((v) => v.id === id);
  if (!wine) return;
  wine.quantidade = Math.max(0, (Number(wine.quantidade) || 0) + delta);
  persist();
  renderAll();
}

function deleteWine(id) {
  vinhos = vinhos.filter((v) => v.id !== id);
  persist();
  renderAll();
}

/* ---------- Form modal ---------- */
const emptyForm = { id: null, nome: "", produtor: "", safra: "", uva: "", regiao: "", pais: "", tipo: "tinto", quantidade: 1, valor: "", local: "", harmonizacao: "", nota: "" };
let formState = { ...emptyForm };

function openForm(id) {
  if (id) {
    const wine = vinhos.find((v) => v.id === id);
    formState = { ...wine };
  } else {
    formState = { ...emptyForm };
  }
  renderForm();
}

function closeForm() {
  document.getElementById("modalRoot").innerHTML = "";
}

function renderForm() {
  const tipoOptionsHtml = TIPOS.map((t) => {
    const active = formState.tipo === t.id;
    return `<button type="button" class="tipo-option ${active ? "active" : ""}" data-tipo="${t.id}" style="${active ? `background:${t.color};border-color:${t.color};` : ""}">${t.label}</button>`;
  }).join("");

  const html = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2 class="serif">${formState.id ? "Editar garrafa" : "Nova garrafa"}</h2>
          <button class="icon-btn" id="closeFormBtn" aria-label="Fechar" style="padding:4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="form-grid">
          <div>
            <label class="field-label">Nome do vinho *</label>
            <input class="field-input" id="f_nome" value="${escapeHtml(formState.nome)}" />
          </div>
          <div class="form-row-2">
            <div><label class="field-label">Produtor</label><input class="field-input" id="f_produtor" value="${escapeHtml(formState.produtor)}" /></div>
            <div><label class="field-label">Safra</label><input class="field-input" id="f_safra" value="${escapeHtml(formState.safra)}" /></div>
          </div>
          <div class="form-row-2">
            <div><label class="field-label">Uva</label><input class="field-input" id="f_uva" value="${escapeHtml(formState.uva)}" /></div>
            <div><label class="field-label">Região</label><input class="field-input" id="f_regiao" value="${escapeHtml(formState.regiao)}" /></div>
          </div>
          <div><label class="field-label">País</label><input class="field-input" id="f_pais" value="${escapeHtml(formState.pais)}" /></div>
          <div>
            <label class="field-label">Tipo</label>
            <div class="tipo-options" id="tipoOptions">${tipoOptionsHtml}</div>
          </div>
          <div class="form-row-2">
            <div><label class="field-label">Quantidade</label><input class="field-input" type="number" id="f_quantidade" value="${escapeHtml(formState.quantidade)}" /></div>
            <div><label class="field-label">Valor (R$)</label><input class="field-input" id="f_valor" value="${escapeHtml(formState.valor)}" /></div>
          </div>
          <div><label class="field-label">Local de compra</label><input class="field-input" id="f_local" value="${escapeHtml(formState.local)}" /></div>
          <div><label class="field-label">Harmonização</label><textarea class="field-textarea" rows="2" id="f_harmonizacao">${escapeHtml(formState.harmonizacao)}</textarea></div>
          <div><label class="field-label">Nota de degustação</label><textarea class="field-textarea" rows="2" id="f_nota">${escapeHtml(formState.nota)}</textarea></div>
        </div>
        <button class="submit-btn" id="submitFormBtn" ${!formState.nome.trim() ? "disabled" : ""}>${formState.id ? "Salvar alterações" : "Adicionar à adega"}</button>
      </div>
    </div>
  `;
  document.getElementById("modalRoot").innerHTML = html;

  document.getElementById("closeFormBtn").addEventListener("click", closeForm);
  document.querySelectorAll(".tipo-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      syncFormFromInputs();
      formState.tipo = btn.getAttribute("data-tipo");
      renderForm();
    });
  });
  document.getElementById("f_nome").addEventListener("input", (e) => {
    document.getElementById("submitFormBtn").disabled = !e.target.value.trim();
  });
  document.getElementById("submitFormBtn").addEventListener("click", submitForm);
}

function syncFormFromInputs() {
  formState.nome = document.getElementById("f_nome").value;
  formState.produtor = document.getElementById("f_produtor").value;
  formState.safra = document.getElementById("f_safra").value;
  formState.uva = document.getElementById("f_uva").value;
  formState.regiao = document.getElementById("f_regiao").value;
  formState.pais = document.getElementById("f_pais").value;
  formState.quantidade = document.getElementById("f_quantidade").value;
  formState.valor = document.getElementById("f_valor").value;
  formState.local = document.getElementById("f_local").value;
  formState.harmonizacao = document.getElementById("f_harmonizacao").value;
  formState.nota = document.getElementById("f_nota").value;
}

function submitForm() {
  syncFormFromInputs();
  if (!formState.nome.trim()) return;
  const clean = { ...formState, quantidade: Number(formState.quantidade) || 0 };
  if (formState.id) {
    vinhos = vinhos.map((v) => (v.id === formState.id ? clean : v));
  } else {
    vinhos.push({ ...clean, id: uid() });
  }
  persist();
  closeForm();
  renderAll();
}

/* ---------- Init ---------- */
document.getElementById("searchInput").addEventListener("input", (e) => {
  query = e.target.value;
  renderList();
});
document.getElementById("fabBtn").addEventListener("click", () => openForm(null));

loadData();
renderAll();
</script>
</body>
</html>
