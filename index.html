  label.field-label { font-size: 12px; color: #7A6F62; display: block; margin-bottom: 6px; }
  .field-input, .field-textarea { width: 100%; background: #FAF7F2; border: 1px solid #E4D9C8; border-radius: 8px; padding: 9px 12px; font-size: 14px; outline: none; color: #2B2320; }

function isAutoSrc(t) { return /^\[(Verificado|Inferência|Não verificado)/.test(t || ""); }
function applyEnrichment() {
  try {
    if (localStorage.getItem(ENRICH_KEY)) return;
    ENRICH.forEach((e) => {
      const w = vinhos.find((v) => v.nome === e.k[0] && (v.produtor === e.k[1] || (e.force && v.produtor === (e.force.produtor || ""))) && (v.safra || "") === e.k[2]);
      if (!w) return;
      const auto = isAutoSrc(w.fontes);
      if (e.force && e.force.produtor && w.produtor === e.k[1]) w.produtor = e.force.produtor;
      if (e.nome_v2 && w.nome === e.k[0]) w.nome = e.nome_v2;
      Object.keys(e).forEach((f) => {
        if (f === "k" || f === "force" || f === "nome_v2") return;
        const empty = !w[f] || String(w[f]).trim() === "";
        if (empty || (auto && V2_FIELDS.includes(f))) w[f] = e[f];
      });
    });
    persist();
    localStorage.setItem(ENRICH_KEY, "1");
  } catch (err) {
    console.error("Enriquecimento não aplicado:", err);
  }
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      vinhos = JSON.parse(raw);
    } else {
      vinhos = SEED_WINES;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(vinhos));
    }
  } catch (e) {
    vinhos = SEED_WINES;
  }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(vinhos));
  } catch (e) {
    console.error("Não foi possível salvar localmente:", e);
  }
}

function applyMigrations() {
  try {
    if (localStorage.getItem(MIGR_KEY)) return;
    NOVOS_V1_1.forEach((n) => {
      const dup = vinhos.some((v) => v.nome === n.nome && v.produtor === n.produtor && v.safra === n.safra);
      if (!dup) vinhos.push({ ...n, id: uid() });
    });
    persist();
    localStorage.setItem(MIGR_KEY, "1");
  } catch (e) {
    console.error("Migração não aplicada:", e);
  }
}

/* ---------- Backup / Restaurar ---------- */
function openBackup() {
  const json = JSON.stringify(vinhos, null, 2);
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2 class="serif">Backup da adega</h2>
          <button class="icon-btn" id="closeBk" aria-label="Fechar" style="padding:4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <p class="bk-help">Toque em <b>Copiar backup</b> e cole em um lugar seguro (Notas, e-mail ou aqui no chat). Para restaurar, cole o texto na caixa e toque em <b>Restaurar</b>.</p>
        <textarea class="field-textarea" id="bkText" rows="10" style="font-family:'Courier New',monospace;font-size:12px;">${escapeHtml(json)}</textarea>
        <button class="submit-btn" id="bkCopy">Copiar backup</button>
        <button class="submit-btn ghost" id="bkRestore">Restaurar do texto</button>
      </div>
    </div>`;
  document.getElementById("closeBk").addEventListener("click", closeForm);
  document.getElementById("bkCopy").addEventListener("click", async () => {
    const ta = document.getElementById("bkText");
    ta.focus();
    ta.setSelectionRange(0, ta.value.length);
    let ok = false;
    try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {}
    if (!ok) { try { ok = document.execCommand("copy"); } catch (e) {} }
    document.getElementById("bkCopy").textContent = ok ? "Copiado ✓" : "Selecione o texto e copie manualmente";
  });
  document.getElementById("bkRestore").addEventListener("click", () => {
    try {
      const data = JSON.parse(document.getElementById("bkText").value);
      if (!Array.isArray(data) || !data.every((v) => v && typeof v.nome === "string")) throw new Error("formato inválido");
      if (!confirm("Substituir a adega atual por " + data.length + " itens do backup?")) return;
      vinhos = data.map((v) => ({ ...v, id: v.id || uid() }));
      persist();
      closeForm();
      renderAll();
    } catch (e) {
      alert("Texto de backup inválido. Nada foi alterado.");
    }
  });
}

function tipoInfo(id) {
  return TIPOS.find((t) => t.id === id) || TIPOS[0];
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

/* ---------- Rendering ---------- */
function renderFilters() {
  const totalGarrafas = vinhos.reduce((s, v) => s + (Number(v.quantidade) || 0), 0);
  document.getElementById("totalGarrafas").textContent = totalGarrafas;

  const countByTipo = (id) => vinhos.filter((v) => v.tipo === id).reduce((s, v) => s + (Number(v.quantidade) || 0), 0);

  let html = `<button class="chip ${activeTipo === "todos" ? "active" : ""}" data-tipo="todos" style="${activeTipo === "todos" ? "background:#5C1220;border-color:#5C1220;" : ""}">Todos · ${totalGarrafas}</button>`;
  TIPOS.forEach((t) => {
    const active = activeTipo === t.id;
    html += `<button class="chip ${active ? "active" : ""}" data-tipo="${t.id}" style="${active ? `background:${t.color};border-color:${t.color};` : ""}">
      <span class="dot" style="background:${active ? "#FFF8F0" : t.color};"></span> ${t.label} · ${countByTipo(t.id)}
    </button>`;
  });
  document.getElementById("filters").innerHTML = html;

  document.querySelectorAll(".chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeTipo = btn.getAttribute("data-tipo");
      renderAll();
    });
  });
}

function renderList() {
  const q = query.trim().toLowerCase();
  const filtered = vinhos.filter((v) => {
    const matchTipo = activeTipo === "todos" || v.tipo === activeTipo;
    const matchQuery = !q || [v.nome, v.produtor, v.uva, v.regiao, v.pais].some((f) => (f || "").toLowerCase().includes(q));
    return matchTipo && matchQuery;
  });

  const container = document.getElementById("listContainer");

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><p>${vinhos.length === 0 ? "Sua adega está vazia. Adicione a primeira garrafa." : "Nenhuma garrafa encontrada com esse filtro."}</p></div>`;
    return;
  }

  container.innerHTML = filtered.map((v) => {
    const info = tipoInfo(v.tipo);
    const extraLines = [];
    if (v.harmonizacao) extraLines.push(`<p><span class="label">Harmoniza com:</span> ${escapeHtml(v.harmonizacao)}</p>`);
    if (v.nota) extraLines.push(`<p><span class="label">Nota:</span> ${escapeHtml(v.nota)}</p>`);
    if (v.composicao) extraLines.push(`<p><span class="label">Composição:</span> ${escapeHtml(v.composicao)}</p>`);
    if (v.amadurecimento) extraLines.push(`<p><span class="label">Amadurecimento:</span> ${escapeHtml(v.amadurecimento)}</p>`);
    if (v.abv || v.guarda) extraLines.push(`<p><span class="label">${v.abv ? "ABV:" : ""}</span> ${escapeHtml(v.abv || "")}${v.abv && v.guarda ? " · " : ""}${v.guarda ? "Guarda: " + escapeHtml(v.guarda) : ""}</p>`);
    if (v.fontes) extraLines.push(`<p class="src-line"><span class="label">Fontes:</span> ${escapeHtml(v.fontes)}</p>`);
    const hasExtra = v.harmonizacao || v.nota || v.valor || v.local || v.composicao || v.amadurecimento || v.abv || v.guarda || v.fontes;
    const certLabel = { verificado: "Verificado", inferencia: "Inferência", nao_verificado: "Não verificado" }[v.certeza];
    const certBadge = certLabel ? `<span class="cert cert-${v.certeza}">${certLabel}</span>` : "";

    return `
      <div class="card" data-id="${v.id}">
        <div class="card-top">
          <div class="card-left">
            <span class="tipo-dot" style="background:${info.color};" title="${info.label}"></span>
            <div style="min-width:0;">
              <h3 class="card-title serif">${escapeHtml(v.nome)}</h3>
              <p class="card-sub">${escapeHtml([v.produtor, v.safra].filter(Boolean).join(" · "))} ${certBadge}</p>
              ${(v.uva || v.regiao || v.pais) ? `<p class="card-origin">${escapeHtml([v.uva, v.regiao, v.pais].filter(Boolean).join(" · "))}</p>` : ""}
            </div>
          </div>
          <div class="qty-box">
            <button class="qty-btn qty-minus" data-id="${v.id}" aria-label="Diminuir"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <span class="qty-num mono">${v.quantidade}</span>
            <button class="qty-btn qty-plus" data-id="${v.id}" aria-label="Aumentar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          </div>
        </div>
        ${hasExtra ? `<div class="card-extra">
          ${extraLines.join("")}
          <div class="card-extra-row">
            ${v.valor ? `<span class="mono">R$ ${escapeHtml(v.valor)}</span>` : ""}
            ${v.local ? `<span>${escapeHtml(v.local)}</span>` : ""}
          </div>
        </div>` : ""}
        <div class="card-actions">
          <button class="icon-btn edit-btn" data-id="${v.id}" aria-label="Editar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="icon-btn danger delete-btn" data-id="${v.id}" aria-label="Excluir"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
        </div>
      </div>
    `;
  }).join("");

  container.querySelectorAll(".qty-minus").forEach((btn) => btn.addEventListener("click", () => adjustQty(btn.getAttribute("data-id"), -1)));
  container.querySelectorAll(".qty-plus").forEach((btn) => btn.addEventListener("click", () => adjustQty(btn.getAttribute("data-id"), 1)));
  container.querySelectorAll(".edit-btn").forEach((btn) => btn.addEventListener("click", () => openForm(btn.getAttribute("data-id"))));
  container.querySelectorAll(".delete-btn").forEach((btn) => btn.addEventListener("click", () => deleteWine(btn.getAttribute("data-id"))));
}

function renderAll() {
  renderFilters();
  renderList();
}

function adjustQty(id, delta) {
  const wine = vinhos.find((v) => v.id === id);
  if (!wine) return;
  wine.quantidade = Math.max(0, (Number(wine.quantidade) || 0) + delta);
  persist();
  renderAll();
}

function deleteWine(id) {
  vinhos = vinhos.filter((v) => v.id !== id);
  persist();
  renderAll();
}

  formState.valor = document.getElementById("f_valor").value;
  formState.local = document.getElementById("f_local").value;
  formState.harmonizacao = document.getElementById("f_harmonizacao").value;
  formState.nota = document.getElementById("f_nota").value;
  ["abv", "composicao", "amadurecimento", "guarda", "fontes", "certeza"].forEach((f) => {
    formState[f] = document.getElementById("f_" + f).value;
  });
}

function submitForm() {
  syncFormFromInputs();
  if (!formState.nome.trim()) return;
  const clean = { ...formState, quantidade: Number(formState.quantidade) || 0 };
  if (formState.id) {
    vinhos = vinhos.map((v) => (v.id === formState.id ? clean : v));
  } else {
    vinhos.push({ ...clean, id: uid() });
  }
  persist();
  closeForm();
  renderAll();
}

/* ---------- Init ---------- */
document.getElementById("searchInput").addEventListener("input", (e) => {
  query = e.target.value;
  renderList();
});
document.getElementById("fabBtn").addEventListener("click", () => openForm(null));
document.getElementById("backupBtn").addEventListener("click", openBackup);

loadData();
applyMigrations();
applyEnrichment();
renderAll();
</script>
</body>
</html>
